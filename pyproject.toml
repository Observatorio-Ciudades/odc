[project]
name = "odc"
version = "0.1.4"
description = "This package streamlines spatial analysis processes by integrating various libraries and developing first-party functions. It is designed as a low-code solution for spatial analysis."
authors = [
    { name = "Observatorio de Ciudades", email = "observatoriodeciudades.tec@gmail.com" },
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "func-timeout>=4.3.5",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "igraph>=1.0.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "planetary-computer>=1.0.0",
    "psycopg2-binary>=2.9.12",
    "pymannkendall>=1.4.3",
    "pyproj>=3.7.2",
    "pystac>=1.15.2",
    "pystac-client>=0.9.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
]

[tool.setuptools.packages.find]
include = ["odc*"]
exclude = ["data*", "demos*", "notebooks*", "output*"]
