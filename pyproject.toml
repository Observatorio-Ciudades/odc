[project]
name = "odc"
version = "0.1.4.1"
description = "This package streamlines spatial analysis processes by integrating various libraries and developing first-party functions. It is designed as a low-code solution for spatial analysis."
authors = [
    { name = "Observatorio de Ciudades", email = "observatoriodeciudades.tec@gmail.com" },
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22,<3",
    "pandas>=1.5,<3",
    "shapely>=1.8,<3",
    "geopandas>=0.12,<2",
    "pyproj>=3.0,<4",
    "rasterio>=1.2,<2",
    "scipy>=1.8,<2",
    "networkx>=2.6,<4",
    "tqdm>=4.60,<5",
    "python-dateutil>=2.8",
    "func-timeout>=4.3",
    "osmnx>=1.5,<3",
    "igraph>=0.9,<2",
    "h3>=4.0,<5",
    "matplotlib>=3.5,<4",
    "scikit-learn>=1.0,<2",
    "pymannkendall>=1.4",
    "pystac>=1.0,<2",
    "pystac-client>=0.6,<1",
    "planetary-computer>=0.4,<2",
    "psycopg2-binary>=2.8",
    "sqlalchemy>=1.4,<3",
    "geoalchemy2>=0.8,<1",
]

[project.entry-points."console_scripts"]


[tool.setuptools.packages.find]
include = ["odc*"]
exclude = ["data*", "demos*", "notebooks*", "output*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
